# =============================================================================
# Fluxer Chat — Frontend Deployment to GitHub Pages
# =============================================================================
# Triggers on pushes to main that touch the frontend/ directory.
# Builds static assets and deploys them via the official GitHub Pages action.
# =============================================================================

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: # Allow manual trigger from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs to let
# production deployments complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build static assets
        working-directory: ./frontend
        env:
          # Inject the Render backend URL so the frontend knows where to connect
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_WS_URL: ${{ vars.BACKEND_WS_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
