# =============================================================================
# Fluxer Chat — Backend Deployment to Render
# =============================================================================
# Triggers a deploy on Render whenever code is pushed to main that touches
# the backend/ directory or infrastructure files. Uses Render's Deploy Hook
# (a simple GET request to a unique URL that triggers a build).
# =============================================================================

name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - "Dockerfile"
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render deployment..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_DEPLOY_HOOK_URL")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "✅ Deploy hook triggered successfully (HTTP $response)"
          else
            echo "❌ Deploy hook failed with HTTP $response"
            exit 1
          fi

      - name: Wait for deployment to begin
        run: |
          echo "⏳ Render is now building and deploying the backend."
          echo "   Monitor progress at: https://dashboard.render.com"
          sleep 10

      - name: Health check (post-deploy)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "🏥 Running post-deploy health check..."
          # Render builds take a few minutes; we'll do a best-effort check.
          # The keep-alive cron job will catch it if this is too early.
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" || true)
            if [ "$status" -eq 200 ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "   Attempt $i: HTTP $status — retrying in 30s..."
            sleep 30
          done
          echo "⚠️  Health check didn't pass yet. Render may still be building."
          echo "   The keep-alive cron will verify once the deploy completes."
