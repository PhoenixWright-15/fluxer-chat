<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxer Chat</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
      <div class="login-container">
        <div class="login-logo">⚡</div>
        <h1 class="login-title">Fluxer</h1>
        <p class="login-subtitle">Your place to talk. Real-time chat, zero friction.</p>
        <form id="login-form">
          <div class="input-group">
            <label for="username-input">DISPLAY NAME</label>
            <input
              type="text"
              id="username-input"
              placeholder="Enter a username"
              maxlength="32"
              autocomplete="off"
              required
            />
          </div>
          <button type="submit" class="btn-primary">
            <span>Continue</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
      <div class="chat-layout">

        <!-- Server Sidebar (narrow icon bar) -->
        <nav class="server-sidebar">
          <div class="server-icon home-icon active" title="Fluxer Home">
            <span>⚡</span>
          </div>
          <div class="server-separator"></div>
          <div class="server-icon" title="My Server" data-server="main">
            <span>F</span>
          </div>
          <div class="server-icon add-server" title="Add a Server">
            <span>+</span>
          </div>
        </nav>

        <!-- Channel Sidebar -->
        <aside class="channel-sidebar">
          <div class="sidebar-header">
            <h2 class="server-name">Fluxer Chat</h2>
          </div>

          <div class="channel-list">
            <div class="channel-category">
              <button class="category-toggle" aria-expanded="true">
                <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                <span>TEXT CHANNELS</span>
              </button>
              <div class="category-channels">
                <button class="channel-btn active" data-room="general">
                  <span class="channel-hash">#</span>
                  <span class="channel-name">general</span>
                  <span class="unread-badge" style="display:none"></span>
                </button>
                <button class="channel-btn" data-room="random">
                  <span class="channel-hash">#</span>
                  <span class="channel-name">random</span>
                  <span class="unread-badge" style="display:none"></span>
                </button>
                <button class="channel-btn" data-room="tech">
                  <span class="channel-hash">#</span>
                  <span class="channel-name">tech</span>
                  <span class="unread-badge" style="display:none"></span>
                </button>
              </div>
            </div>
          </div>

          <div class="user-panel">
            <div class="user-panel-info">
              <div class="user-avatar" id="user-avatar"></div>
              <div class="user-details">
                <span class="user-display-name" id="user-display-name"></span>
                <span class="user-status-text">Online</span>
              </div>
            </div>
            <button class="btn-icon" id="logout-btn" title="Logout">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </button>
          </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
          <header class="chat-header">
            <div class="chat-header-left">
              <span class="header-hash">#</span>
              <span class="chat-room-name" id="chat-room-name">general</span>
              <div class="header-divider"></div>
              <span class="chat-topic" id="chat-topic">Welcome to #general — say hi!</span>
            </div>
            <div class="chat-header-right">
              <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting…</span>
              </div>
              <button class="btn-icon members-toggle" id="members-toggle" title="Toggle Member List">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
              </button>
            </div>
          </header>

          <div class="chat-content">
            <div class="messages-scroll" id="messages-container">
              <div class="messages-list" id="messages-list">
                <!-- Welcome placeholder -->
                <div class="welcome-message" id="welcome-message">
                  <div class="welcome-icon">
                    <span class="welcome-hash">#</span>
                  </div>
                  <h3>Welcome to #<span id="welcome-room-name">general</span>!</h3>
                  <p>This is the start of the #<span id="welcome-room-name-2">general</span> channel.</p>
                </div>
              </div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
              <!-- Typing indicator placeholder -->
            </div>

            <form class="message-form" id="message-form">
              <div class="message-input-wrapper">
                <button type="button" class="btn-icon attach-btn" title="Attach file">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </button>
                <input
                  type="text"
                  id="message-input"
                  placeholder="Message #general"
                  maxlength="2000"
                  autocomplete="off"
                />
                <button type="submit" class="btn-icon send-btn" title="Send message">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </div>
            </form>
          </div>
        </main>

        <!-- Members Sidebar -->
        <aside class="members-sidebar" id="members-sidebar">
          <div class="members-header">Members</div>
          <div class="members-section">
            <div class="members-section-title">ONLINE — <span id="online-count">0</span></div>
            <div class="members-list" id="members-list">
              <!-- Members will be populated dynamically -->
            </div>
          </div>
        </aside>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
